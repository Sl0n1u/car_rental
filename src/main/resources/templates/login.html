<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - Wypożyczalnia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow" style="width: 25rem;">
        <h3 class="text-center mb-4">Logowanie</h3>

        <div th:if="${param.error}" class="alert alert-danger">
            Nieprawidłowy login lub hasło.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Wylogowano pomyślnie.
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            Konto utworzone! Możesz się zalogować.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Nazwa użytkownika</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Hasło</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Zaloguj się</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/register}">Nie masz konta? Zarejestruj się</a>
        </div>
    </div>
</body>
</html>
