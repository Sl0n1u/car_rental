<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Moje Wypożyczenia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Profil Użytkownika</span>
            <a th:href="@{/rentals/all}" class="btn btn-outline-warning btn-sm me-2" sec:authorize="hasRole('ADMIN')">Zarządzaj Wynajmami</a>
            <a th:href="@{/cars}" class="btn btn-outline-light btn-sm">Powrót do floty</a>
        </div>
    </nav>
    <div class="container">
        <h2>Twoja historia wypożyczeń</h2>
        <div class="card shadow-sm mt-3">
            <table class="table table-striped m-0">
                <thead class="table-dark">
                    <tr>
                        <th>Samochód</th>
                        <th>Od</th>
                        <th>Do</th>
                        <th>Koszt całkowity</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${rentals.isEmpty()}">
                        <td colspan="4" class="text-center py-4 text-muted">Nie wypożyczyłeś jeszcze żadnego auta.</td>
                    </tr>
                    <tr th:each="rental : ${rentals}">
                        <td th:text="${rental.car.brand} + ' ' + ${rental.car.model}">Auto</td>
                        <td th:text="${rental.startDate}">Od</td>
                        <td th:text="${rental.endDate}">Do</td>
                        <td><strong th:text="${rental.totalPrice}"></strong> PLN</td>
                        <td>
                            <span th:if="${rental.status == 'OCZEKUJE'}" class="badge bg-warning text-dark">Oczekiwana na potwierdzenie</span>
                            <span th:if="${rental.status == 'ZATWIERDZONY'}" class="badge bg-success">Zatwierdzona</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
