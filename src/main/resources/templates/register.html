<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja - AUTEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow border-0 border-top border-danger border-4" style="width: 25rem;">
        
        <div class="text-center mb-4 mt-2">
            <img th:src="@{/images/Autex.png}" alt="AUTEX Logo" class="img-fluid rounded shadow" style="max-width: 180px;">
        </div>

        <div th:if="${error}" class="alert alert-danger fw-bold" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-bold">Nazwa użytkownika</label>
                <input type="text" id="username" th:field="*{username}" class="form-control" th:errorclass="is-invalid" required autofocus>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Adres Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="phoneNumber" class="form-label fw-bold">Numer telefonu</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" th:errorclass="is-invalid" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Hasło</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            
            <button type="submit" class="btn btn-danger w-100 fw-bold">ZAREJESTRUJ SIĘ</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/login}" class="text-dark text-decoration-none border-bottom border-dark">Masz już konto? Zaloguj się</a>
        </div>
    </div>
</body>
</html>
