<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nasza Flota - Wypożyczalnia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Wypożyczalnia Aut</span>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm" type="submit">Wyloguj się</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Dostępne samochody</h2>
            <a th:href="@{/cars/add}" class="btn btn-success">Dodaj nowe auto</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover m-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Marka</th>
                            <th>Model</th>
                            <th>Silnik</th>
                            <th>Cena za dobę</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${cars.isEmpty()}">
                            <td colspan="4" class="text-center py-4 text-muted">Obecnie brak pojazdów w naszej flocie.</td>
                        </tr>
                        <tr th:each="car : ${cars}">
                            <td th:text="${car.brand}">Marka</td>
                            <td th:text="${car.model}">Model</td>
                            <td th:text="${car.engineDetails}">Silnik</td>
                            <td><span th:text="${car.pricePerDay}"></span> PLN</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
