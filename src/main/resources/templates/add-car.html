<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dodaj Pojazd - Wypożyczalnia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Panel Zarządzania Flotą</span>
            <a th:href="@{/cars}" class="btn btn-outline-light btn-sm">Powrót do listy</a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center">
        <div class="card shadow" style="width: 35rem;">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Dodaj nowy samochód do bazy</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/cars/add}" th:object="${car}" method="post">
                    
                    <div class="mb-3">
                        <label for="brand" class="form-label">Marka</label>
                        <input type="text" id="brand" th:field="*{brand}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="model" class="form-label">Model</label>
                        <input type="text" id="model" th:field="*{model}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="engineDetails" class="form-label">Szczegóły silnika (opcjonalnie)</label>
                        <input type="text" id="engineDetails" th:field="*{engineDetails}" class="form-control" placeholder="np. 2.0 CVVT Hybrid">
                    </div>

                    <div class="mb-3">
                        <label for="pricePerDay" class="form-label">Cena za dobę (PLN)</label>
                        <input type="number" id="pricePerDay" th:field="*{pricePerDay}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('pricePerDay')}" th:errors="*{pricePerDay}"></div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Zapisz pojazd w bazie</button>
                        <a th:href="@{/cars}" class="btn btn-outline-secondary">Anuluj</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
