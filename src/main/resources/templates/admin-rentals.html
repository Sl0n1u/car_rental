<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Zarządzanie Wynajmami - AUTEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 border-bottom border-danger border-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/cars}">
                <img th:src="@{/images/Autex.png}" alt="AUTEX Logo" height="45" class="d-inline-block align-top rounded shadow-sm">
            </a>
            
            <form th:action="@{/logout}" method="post" class="d-flex align-items-center mb-0">
                <a th:href="@{/cars/add}" class="btn btn-outline-danger btn-sm me-2 fw-bold" sec:authorize="hasRole('ADMIN')">+ Dodaj nowe auto</a>
                <a th:href="@{/rentals/all}" class="btn btn-outline-danger btn-sm me-2 fw-bold" sec:authorize="hasRole('ADMIN')">Panel Administratora</a>
                <a th:href="@{/rentals/my}" class="btn btn-outline-light btn-sm me-3">Moje Wypożyczenia</a>
                <button class="btn btn-dark border-secondary btn-sm fw-bold" type="submit">Wyloguj</button>
            </form>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <h2 class="fw-bold mb-3 text-danger">PANEL ADMINISTRATORA</h2>
        
        <div class="card shadow-sm border-0 border-top border-dark border-4">
            <div class="card-body p-0 overflow-hidden rounded">
                <table class="table table-striped table-hover m-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Klient (Kontakt)</th>
                            <th>Samochód</th>
                            <th>Termin</th>
                            <th>Kwota</th>
                            <th>Status</th>
                            <th class="text-center">Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${rentals.isEmpty()}">
                            <td colspan="7" class="text-center py-4 text-muted">Brak rezerwacji w systemie.</td>
                        </tr>
                        <tr th:each="rental : ${rentals}">
                            <td class="fw-bold text-muted" th:text="'#' + ${rental.id}"></td>
                            <td>
                                <strong th:text="${rental.appUser.username}"></strong><br>
                                <small class="text-muted" th:text="${rental.appUser.email}"></small><br>
                                <small class="text-muted fw-bold" th:text="${rental.appUser.phoneNumber}"></small>
                            </td>
                            <td class="fw-bold" th:text="${rental.car.brand} + ' ' + ${rental.car.model}"></td>
                            <td th:text="${rental.startDate} + ' / ' + ${rental.endDate}"></td>
                            <td><strong class="text-danger" th:text="${rental.totalPrice} + ' PLN'"></strong></td>
                            <td>
                                <span th:if="${rental.status == 'OCZEKUJE'}" class="badge bg-warning text-dark">Oczekuje</span>
                                <span th:if="${rental.status == 'ZATWIERDZONY'}" class="badge bg-success">Zatwierdzony</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2 justify-content-center">
                                    <form th:if="${rental.status == 'OCZEKUJE'}" th:action="@{/rentals/confirm/{id}(id=${rental.id})}" method="post">
                                        <button type="submit" class="btn btn-dark btn-sm fw-bold">ZATWIERDŹ</button>
                                    </form>
                                    <form th:action="@{/rentals/delete/{id}(id=${rental.id})}" method="post" onsubmit="return confirm('Na pewno usunąć ten wynajem?');">
                                        <button type="submit" class="btn btn-danger btn-sm fw-bold">USUŃ</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
