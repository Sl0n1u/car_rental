<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zarządzanie Wynajmami</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Panel Administratora - Wynajmy</span>
            <a th:href="@{/cars}" class="btn btn-outline-light btn-sm">Powrót do floty</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover m-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Klient (Kontakt)</th>
                            <th>Samochód</th>
                            <th>Termin</th>
                            <th>Kwota</th>
                            <th>Status</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${rentals.isEmpty()}">
                            <td colspan="7" class="text-center py-4 text-muted">Brak rezerwacji w systemie.</td>
                        </tr>
                        <tr th:each="rental : ${rentals}">
                            <td th:text="${rental.id}"></td>
                            <td>
                                <strong th:text="${rental.appUser.username}"></strong><br>
                                <small class="text-muted" th:text="${rental.appUser.email}"></small><br>
                                <small class="text-muted" th:text="${rental.appUser.phoneNumber}"></small>
                            </td>
                            <td th:text="${rental.car.brand} + ' ' + ${rental.car.model}"></td>
                            <td th:text="${rental.startDate} + ' do ' + ${rental.endDate}"></td>
                            <td><strong th:text="${rental.totalPrice}"></strong> PLN</td>
                            <td>
                                <span th:if="${rental.status == 'OCZEKUJE'}" class="badge bg-warning text-dark">Oczekuje</span>
                                <span th:if="${rental.status == 'ZATWIERDZONY'}" class="badge bg-success">Zatwierdzony</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <form th:if="${rental.status == 'OCZEKUJE'}" th:action="@{/rentals/confirm/{id}(id=${rental.id})}" method="post">
                                        <button type="submit" class="btn btn-success btn-sm">Zatwierdź</button>
                                    </form>
                                    <form th:action="@{/rentals/delete/{id}(id=${rental.id})}" method="post" onsubmit="return confirm('Na pewno usunąć ten wynajem?');">
                                        <button type="submit" class="btn btn-danger btn-sm">Usuń</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
