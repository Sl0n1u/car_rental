<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Potwierdzenie Wynajmu - AUTEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 35rem;">
        <div class="card shadow border-0 border-top border-danger border-4">
            <div class="card-header bg-dark text-white text-center py-3">
                <img th:src="@{/images/Autex.png}" alt="AUTEX Logo" height="40" class="mb-2 rounded"><br>
                <h5 class="mb-0 fw-bold text-uppercase tracking-wide">Podsumowanie Rezerwacji</h5>
            </div>
            <div class="card-body p-4">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                
                <h4 class="fw-bold text-center mb-1" th:text="${car.brand} + ' ' + ${car.model}"></h4>
                <p class="text-center text-muted border-bottom pb-3 mb-4" th:text="'Silnik: ' + ${car.engineDetails} + ' | ' + ${car.pricePerDay} + ' PLN/doba'"></p>
                
                <ul class="list-group list-group-flush mb-4">
                    <li class="list-group-item d-flex justify-content-between px-0">
                        <span class="text-muted fw-bold">Odbiór:</span>
                        <strong th:text="${startDate}"></strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between px-0">
                        <span class="text-muted fw-bold">Zwrot:</span>
                        <strong th:text="${endDate}"></strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between px-0">
                        <span class="text-muted fw-bold">Liczba dni:</span>
                        <strong th:text="${days}"></strong>
                    </li>
                    <li class="list-group-item d-flex justify-content-between bg-light mt-2 p-3 border rounded">
                        <span class="fs-5 fw-bold">DO ZAPŁATY:</span>
                        <strong class="fs-4 text-danger" th:text="${totalPrice} + ' PLN'"></strong>
                    </li>
                </ul>
                
                <form th:action="@{/rentals/car/{id}(id=${car.id})}" method="post">
                    <input type="hidden" name="startDate" th:value="${startDate}">
                    <input type="hidden" name="endDate" th:value="${endDate}">
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg fw-bold">POTWIERDZAM REZERWACJĘ</button>
                        <a th:href="@{/cars}" class="btn btn-outline-dark fw-bold">ANULUJ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
